name: briefly
description: "A production-ready Flutter news application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.6.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.1.0
  lottie: ^3.1.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.0.0
  share_plus: ^10.0.0
  get_it: ^7.6.0
  go_router: ^14.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/briefly_logo.png
    - assets/animations/news.json
